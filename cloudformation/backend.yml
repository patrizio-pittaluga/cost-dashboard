AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Bilancio personale - backend Milano, Cognito Lite e TOTP obbligatorio,
  HTTP API JWT, Lambda Python e DynamoDB. DEPLOY SOLO IN eu-south-1.

Parameters:
  CloudFrontDomain:
    Type: String
    Description: 'Valore Output CloudFrontDomain dello stack frontend (es. d123abc.cloudfront.net)'
    AllowedPattern: '^[a-z0-9-]+\.cloudfront\.net$'
  CognitoDomainPrefix:
    Type: String
    MinLength: 4
    MaxLength: 63
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])$'
    Description: 'Prefisso pubblico Cognito univoco nella regione'
  CustomFrontendDomain:
    Type: String
    Default: ''
    Description: 'OPZIONALE (futuro): spese.ilsitodipatrizio.it; non inserirlo finche DNS e certificato CloudFront non sono attivi'
    AllowedPattern: '^$|^[a-z0-9](?:[a-z0-9.-]*[a-z0-9])$'

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomFrontendDomain, '']]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UserPoolTier: LITE
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: bilancio-web
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs:
        - !Sub 'https://${CloudFrontDomain}/'
        - !If [HasCustomDomain, !Sub 'https://${CustomFrontendDomain}/', !Ref 'AWS::NoValue']
      LogoutURLs:
        - !Sub 'https://${CloudFrontDomain}/'
        - !If [HasCustomDomain, !Sub 'https://${CustomFrontendDomain}/', !Ref 'AWS::NoValue']
      AccessTokenValidity: 30
      IdTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 1 # Classic hosted UI: supportata dal piano Cognito LITE

  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Default AWS-owned key: dati cifrati senza KMS a pagamento.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false # Export JSON di backup: PITR ha costi aggiuntivi

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: table-and-logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoRecords
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                Resource: !GetAtt DataTable.Arn
              - Sid: LambdaLogStream
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ApiLogGroup.Arn}:*'

  ApiLambda:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 128
      Timeout: 10
      ReservedConcurrentExecutions: 2
      Role: !GetAtt ApiLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Code:
        ZipFile: |
          """HTTP API privata per il bilancio personale.
          
          Non riceve credenziali. API Gateway convalida firma e scadenza JWT; qui
          verifichiamo che sia un *access token* per il client atteso e imponiamo
          la partizione DynamoDB ricavata ESCLUSIVAMENTE dal claim `sub` firmato.
          """
          
          import base64
          import datetime as dt
          import json
          import logging
          import os
          import re
          from decimal import Decimal, InvalidOperation
          
          import boto3
          from botocore.exceptions import ClientError
          
          _LOG = logging.getLogger(__name__)
          _LOG.setLevel(logging.WARNING)
          _TABLE = boto3.resource("dynamodb").Table(os.environ["TABLE_NAME"])
          _CLIENT_ID = os.environ["COGNITO_CLIENT_ID"]
          
          EXPENSE_CATEGORIES = frozenset(
              ["Casa", "Alimentari", "Trasporti", "Bollette", "Salute", "Svago", "Shopping", "Altro"]
          )
          INCOME_CATEGORIES = frozenset(["Stipendio", "Extra", "Rimborsi", "Altre entrate"])
          ID_PATTERN = re.compile(r"^[A-Za-z0-9_-]{1,80}$")
          DATE_PATTERN = re.compile(r"^\d{4}-\d{2}-\d{2}$")
          
          
          class BadRequest(Exception):
              pass
          
          
          def response(status, data=None):
              result = {
                  "statusCode": status,
                  "headers": {"content-type": "application/json; charset=utf-8", "cache-control": "no-store"},
              }
              if data is not None:
                  result["body"] = json.dumps(data, ensure_ascii=False, separators=(",", ":"))
              return result
          
          
          def parse_json(event):
              body = event.get("body") or ""
              if not isinstance(body, str) or len(body) > 32000:
                  raise BadRequest("Richiesta troppo grande")
              try:
                  if event.get("isBase64Encoded"):
                      body = base64.b64decode(body, validate=True).decode("utf-8")
                  data = json.loads(body)
              except (ValueError, UnicodeError):
                  raise BadRequest("JSON non valido") from None
              if not isinstance(data, dict):
                  raise BadRequest("Il corpo deve essere un oggetto JSON")
              return data
          
          
          def amount_to_cents(value, *, allow_zero=False):
              if isinstance(value, bool) or not isinstance(value, (int, float, str)):
                  raise BadRequest("Importo non valido")
              try:
                  dec = Decimal(str(value))
              except InvalidOperation:
                  raise BadRequest("Importo non valido") from None
              if not dec.is_finite() or (dec < 0 if allow_zero else dec <= 0) or dec > 1_000_000:
                  raise BadRequest("Importo fuori limite")
              cents = dec * 100
              if cents != cents.to_integral_value():
                  raise BadRequest("Massimo due decimali")
              return int(cents)
          
          
          def validate_transaction(data, tx_id=None):
              ident = data.get("id")
              if not isinstance(ident, str) or not ID_PATTERN.fullmatch(ident):
                  raise BadRequest("ID movimento non valido")
              if tx_id is not None and ident != tx_id:
                  raise BadRequest("ID incoerente")
              description = data.get("description")
              if not isinstance(description, str) or not (1 <= len(description.strip()) <= 120):
                  raise BadRequest("Descrizione non valida")
              kind = data.get("type")
              if kind not in ("income", "expense"):
                  raise BadRequest("Tipo movimento non valido")
              category = data.get("category")
              valid_categories = INCOME_CATEGORIES if kind == "income" else EXPENSE_CATEGORIES
              if not isinstance(category, str) or category not in valid_categories:
                  raise BadRequest("Categoria non valida")
              date_string = data.get("date")
              if not isinstance(date_string, str) or not DATE_PATTERN.fullmatch(date_string):
                  raise BadRequest("Data non valida")
              try:
                  dt.date.fromisoformat(date_string)
              except ValueError:
                  raise BadRequest("Data non valida") from None
              note = data.get("note", "")
              if not isinstance(note, str) or len(note) > 300:
                  raise BadRequest("Nota troppo lunga")
              cents = amount_to_cents(data.get("amount"))
              return {
                  "id": ident,
                  "description": description.strip(),
                  "type": kind,
                  "category": category,
                  "date": date_string,
                  "note": note,
                  "amountCents": cents,
              }
          
          
          def to_public_transaction(row):
              value = dict(row)
              value["amount"] = int(value.pop("amountCents")) / 100
              return value
          
          
          def handler(event, context):
              # Il JWT Authorizer e' configurato su OGNI route applicativa.
              claims = (((event.get("requestContext") or {}).get("authorizer") or {}).get("jwt") or {}).get("claims") or {}
              subject = claims.get("sub")
              if (
                  not isinstance(subject, str)
                  or not subject
                  or claims.get("token_use") != "access"
                  or claims.get("client_id") != _CLIENT_ID
              ):
                  return response(403, {"error": "Access token Cognito richiesto"})
          
              user_pk = "USER#" + subject
              route = event.get("routeKey", "")
              path_params = event.get("pathParameters") or {}
          
              try:
                  if route == "GET /state":
                      transactions, budgets = [], {}
                      exclusive_key = None
                      while True:
                          kwargs = {"KeyConditionExpression": "PK = :pk", "ExpressionAttributeValues": {":pk": user_pk}}
                          if exclusive_key:
                              kwargs["ExclusiveStartKey"] = exclusive_key
                          result = _TABLE.query(**kwargs)
                          for item in result.get("Items", []):
                              sk = item["SK"]
                              if sk.startswith("TX#"):
                                  transactions.append(to_public_transaction(item["value"]))
                              elif sk.startswith("B#"):
                                  budgets[sk[2:]] = int(item["amountCents"]) / 100
                          if len(transactions) > 10000:
                              return response(413, {"error": "Archivio troppo grande: serve paginazione"})
                          exclusive_key = result.get("LastEvaluatedKey")
                          if not exclusive_key:
                              break
                      return response(200, {"transactions": transactions, "budgets": budgets})
          
                  if route == "POST /transactions":
                      record = validate_transaction(parse_json(event))
                      try:
                          _TABLE.put_item(
                              Item={"PK": user_pk, "SK": "TX#" + record["id"], "value": record},
                              ConditionExpression="attribute_not_exists(PK)",
                          )
                      except ClientError as err:
                          if err.response["Error"]["Code"] == "ConditionalCheckFailedException":
                              return response(409, {"error": "ID movimento già esistente"})
                          raise
                      return response(201, to_public_transaction(record))
          
                  if route == "PUT /transactions/{id}":
                      tx_id = path_params.get("id")
                      if not isinstance(tx_id, str) or not ID_PATTERN.fullmatch(tx_id):
                          raise BadRequest("ID movimento non valido")
                      record = validate_transaction(parse_json(event), tx_id)
                      try:
                          _TABLE.put_item(
                              Item={"PK": user_pk, "SK": "TX#" + tx_id, "value": record},
                              ConditionExpression="attribute_exists(PK)",
                          )
                      except ClientError as err:
                          if err.response["Error"]["Code"] == "ConditionalCheckFailedException":
                              return response(404, {"error": "Movimento inesistente"})
                          raise
                      return response(200, to_public_transaction(record))
          
                  if route == "DELETE /transactions/{id}":
                      tx_id = path_params.get("id")
                      if not isinstance(tx_id, str) or not ID_PATTERN.fullmatch(tx_id):
                          raise BadRequest("ID movimento non valido")
                      try:
                          _TABLE.delete_item(
                              Key={"PK": user_pk, "SK": "TX#" + tx_id},
                              ConditionExpression="attribute_exists(PK)",
                          )
                      except ClientError as err:
                          if err.response["Error"]["Code"] == "ConditionalCheckFailedException":
                              return response(404, {"error": "Movimento inesistente"})
                          raise
                      return response(204)
          
                  if route == "PUT /budgets/{category}":
                      category = path_params.get("category")
                      if category not in EXPENSE_CATEGORIES:
                          raise BadRequest("Categoria budget non valida")
                      data = parse_json(event)
                      cents = amount_to_cents(data.get("amount"), allow_zero=True)
                      _TABLE.put_item(Item={"PK": user_pk, "SK": "B#" + category, "amountCents": cents})
                      return response(200, {"category": category, "amount": cents / 100})
          
                  return response(404, {"error": "Rotta inesistente"})
              except BadRequest as err:
                  return response(400, {"error": str(err)})
              except Exception:
                  _LOG.exception("Errore inatteso nell'API")
                  return response(500, {"error": "Errore interno"})

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${CloudFrontDomain}'
          - !If [HasCustomDomain, !Sub 'https://${CustomFrontendDomain}', !Ref 'AWS::NoValue']
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: cognito-jwt
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
        Audience: [!Ref UserPoolClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiLambda.Arn
      PayloadFormatVersion: '2.0'

  ReadStateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /state'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  CreateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /transactions'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /transactions/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeleteTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /transactions/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateBudgetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /budgets/{category}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'


Outputs:
  ApiUrl:
    Description: 'Base URL per le chiamate API autenticate'
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoHostedUiBaseUrl:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  TableName:
    Value: !Ref DataTable
