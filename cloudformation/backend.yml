AWSTemplateFormatVersion: '2010-09-09'
Description: >-
  Moneta - backend Milano; Cognito Lite e MFA TOTP obbligatoria,
  HTTP API JWT, Lambda Python e DynamoDB. DEPLOY SOLO IN eu-south-1.

Parameters:
  CloudFrontDomain:
    Type: String
    Description: 'Valore Output CloudFrontDomain dello stack frontend (es. d123abc.cloudfront.net)'
    AllowedPattern: '^[a-z0-9-]+\.cloudfront\.net$'
  CustomDomainName:
    Type: String
    Default: ''
    AllowedPattern: '^$|^moneta\.ilsitodipatrizio\.it$'
    Description: 'Dominio personalizzato per redirect OAuth e CORS'
  CognitoDomainPrefix:
    Type: String
    MinLength: 4
    MaxLength: 63
    AllowedPattern: '^[a-z0-9](?:[a-z0-9-]*[a-z0-9])$'
    Description: 'Prefisso pubblico Cognito univoco nella regione'

  LambdaCodeBucket:
    Type: String
    Description: 'Bucket privato deployment eu-south-1 (Moneta 2.1)'
  LambdaCodeKey:
    Type: String
    Description: 'Chiave ZIP Lambda con hash del sorgente'
  AdminCodeKey:
    Type: String
    Description: 'Chiave ZIP Lambda admin utenti'
  CostsCodeKey:
    Type: String
    Description: 'Chiave ZIP Lambda dashboard costi'

Conditions:
  HasCustomDomain: !Not [!Equals [!Ref CustomDomainName, '']]

Resources:
  UserPool:
    Type: AWS::Cognito::UserPool
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      UserPoolName: !Sub '${AWS::StackName}-users'
      UserPoolTier: LITE
      DeletionProtection: ACTIVE
      UsernameAttributes: [email]
      AutoVerifiedAttributes: [email]
      AdminCreateUserConfig:
        AllowAdminCreateUserOnly: true
      Policies:
        PasswordPolicy:
          MinimumLength: 14
          RequireUppercase: true
          RequireLowercase: true
          RequireNumbers: true
          RequireSymbols: true
          TemporaryPasswordValidityDays: 7
      MfaConfiguration: "ON"
      EnabledMfas: [SOFTWARE_TOKEN_MFA]
      AccountRecoverySetting:
        RecoveryMechanisms:
          - Name: verified_email
            Priority: 1

  AdminsGroup:
    Type: AWS::Cognito::UserPoolGroup
    Properties:
      GroupName: Admins
      Description: 'Visualizzazione costi e dashboard AWS, non dati privati degli utenti'
      UserPoolId: !Ref UserPool

  UserPoolClient:
    Type: AWS::Cognito::UserPoolClient
    Properties:
      ClientName: !Sub '${AWS::StackName}-web'
      UserPoolId: !Ref UserPool
      GenerateSecret: false
      PreventUserExistenceErrors: ENABLED
      EnableTokenRevocation: true
      SupportedIdentityProviders: [COGNITO]
      ExplicitAuthFlows: [ALLOW_USER_SRP_AUTH, ALLOW_REFRESH_TOKEN_AUTH]
      AllowedOAuthFlowsUserPoolClient: true
      AllowedOAuthFlows: [code]
      AllowedOAuthScopes: [openid, email]
      CallbackURLs:
        - !Sub 'https://${CloudFrontDomain}/'
        - !If [HasCustomDomain, !Sub 'https://${CustomDomainName}/', !Ref 'AWS::NoValue']
      LogoutURLs:
        - !Sub 'https://${CloudFrontDomain}/'
        - !If [HasCustomDomain, !Sub 'https://${CustomDomainName}/', !Ref 'AWS::NoValue']
      AccessTokenValidity: 30
      IdTokenValidity: 30
      TokenValidityUnits:
        AccessToken: minutes
        IdToken: minutes

  UserPoolDomain:
    Type: AWS::Cognito::UserPoolDomain
    Properties:
      UserPoolId: !Ref UserPool
      Domain: !Ref CognitoDomainPrefix
      ManagedLoginVersion: 1 # Classic hosted UI: supportata dal piano Cognito LITE

  DataTable:
    Type: AWS::DynamoDB::Table
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      BillingMode: PROVISIONED
      ProvisionedThroughput:
        ReadCapacityUnits: 5
        WriteCapacityUnits: 5
      AttributeDefinitions:
        - AttributeName: PK
          AttributeType: S
        - AttributeName: SK
          AttributeType: S
      KeySchema:
        - AttributeName: PK
          KeyType: HASH
        - AttributeName: SK
          KeyType: RANGE
      # Default AWS-owned key: dati cifrati senza KMS a pagamento.
      PointInTimeRecoverySpecification:
        PointInTimeRecoveryEnabled: false # Export JSON di backup: PITR ha costi aggiuntivi

  ApiLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-api'
      RetentionInDays: 7

  ApiLambdaRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: lambda.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: table-and-logs-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: DynamoRecords
                Effect: Allow
                Action:
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:GetItem
                  - dynamodb:PutItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                  - dynamodb:ConditionCheckItem
                Resource: !GetAtt DataTable.Arn
              - Sid: LookupInvitedCognitoUsers
                Effect: Allow
                Action: cognito-idp:ListUsers
                Resource: !GetAtt UserPool.Arn
              - Sid: LambdaLogStream
                Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                Resource: !Sub '${ApiLogGroup.Arn}:*'

  ApiLambda:
    Type: AWS::Lambda::Function
    DependsOn: ApiLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-api'
      Runtime: python3.13
      Handler: index.handler
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt ApiLambdaRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          USER_POOL_ID: !Ref UserPool
          MONTHLY_COST_LIMIT_USD: 3
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref LambdaCodeKey
  # Security hardening 2.2.7: ruoli distinti, stessi servizi AWS esistenti.
  AdminUsersLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-admin-users'
      RetentionInDays: 7

  CostsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub '/aws/lambda/${AWS::StackName}-costs'
      RetentionInDays: 7

  AdminUsersRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: cognito-user-administration-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminListGroupsForUser
                  - cognito-idp:AdminCreateUser
                  - cognito-idp:AdminGetUser
                  - cognito-idp:AdminSetUserPassword
                  - cognito-idp:AdminDisableUser
                  - cognito-idp:AdminEnableUser
                  - cognito-idp:AdminUserGlobalSignOut
                Resource: !GetAtt UserPool.Arn
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${AdminUsersLogGroup.Arn}:*'

  CostsRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal: {Service: lambda.amazonaws.com}
            Action: sts:AssumeRole
      Policies:
        - PolicyName: read-costs-and-admin-membership-only
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Sid: LookupCurrentAdmin
                Effect: Allow
                Action:
                  - cognito-idp:ListUsers
                  - cognito-idp:AdminListGroupsForUser
                Resource: !GetAtt UserPool.Arn
              - Sid: BillingRead
                Effect: Allow
                Action: ce:GetCostAndUsage
                Resource: '*'
              - Sid: CostCacheOnly
                Effect: Allow
                Action: [dynamodb:GetItem, dynamodb:PutItem]
                Resource: !GetAtt DataTable.Arn
                Condition:
                  ForAllValues:StringEquals:
                    dynamodb:LeadingKeys: ['SYSTEM#AWS_COSTS']
                  Null:
                    dynamodb:LeadingKeys: 'false'
              - Sid: LambdaLogs
                Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents]
                Resource: !Sub '${CostsLogGroup.Arn}:*'

  AdminUsersLambda:
    Type: AWS::Lambda::Function
    DependsOn: AdminUsersLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-admin-users'
      Runtime: python3.13
      Handler: admin_users.handler
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt AdminUsersRole.Arn
      Environment:
        Variables:
          USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref AdminCodeKey

  CostsLambda:
    Type: AWS::Lambda::Function
    DependsOn: CostsLogGroup
    Properties:
      FunctionName: !Sub '${AWS::StackName}-costs'
      Runtime: python3.13
      Handler: admin_costs.handler
      MemorySize: 128
      Timeout: 20
      Role: !GetAtt CostsRole.Arn
      Environment:
        Variables:
          TABLE_NAME: !Ref DataTable
          USER_POOL_ID: !Ref UserPool
          COGNITO_CLIENT_ID: !Ref UserPoolClient
          MONTHLY_COST_LIMIT_USD: 3
      Code:
        S3Bucket: !Ref LambdaCodeBucket
        S3Key: !Ref CostsCodeKey

  HttpApi:
    Type: AWS::ApiGatewayV2::Api
    Properties:
      Name: !Sub '${AWS::StackName}-http-api'
      ProtocolType: HTTP
      CorsConfiguration:
        AllowOrigins:
          - !Sub 'https://${CloudFrontDomain}'
          - !If [HasCustomDomain, !Sub 'https://${CustomDomainName}', !Ref 'AWS::NoValue']
        AllowMethods: [GET, POST, PUT, DELETE, OPTIONS]
        AllowHeaders: [authorization, content-type]
        MaxAge: 3600

  JwtAuthorizer:
    Type: AWS::ApiGatewayV2::Authorizer
    Properties:
      ApiId: !Ref HttpApi
      AuthorizerType: JWT
      Name: moneta-cognito-jwt
      IdentitySource: ['$request.header.Authorization']
      JwtConfiguration:
        Issuer: !Sub 'https://cognito-idp.${AWS::Region}.${AWS::URLSuffix}/${UserPool}'
        Audience: [!Ref UserPoolClient]

  ApiIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt ApiLambda.Arn
      PayloadFormatVersion: '2.0'

  AdminUsersIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt AdminUsersLambda.Arn
      PayloadFormatVersion: '2.0'

  CostsIntegration:
    Type: AWS::ApiGatewayV2::Integration
    Properties:
      ApiId: !Ref HttpApi
      IntegrationType: AWS_PROXY
      IntegrationUri: !GetAtt CostsLambda.Arn
      PayloadFormatVersion: '2.0'

  AdminUsersLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref AdminUsersLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*/admin/users*'

  CostsLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref CostsLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/GET/costs'

  ReadProfileRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /me'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  CreateSpaceRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /spaces'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ReadMembersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /spaces/{id}/members'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  CreateInviteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /spaces/{id}/invites'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  AcceptInviteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /invites/{id}/accept'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeclineInviteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /invites/{id}/decline'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  RemoveMemberRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /spaces/{id}/members/{userId}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ReadStateRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /state'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  CreateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /transactions'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /transactions/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeleteTransactionRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /transactions/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateBudgetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /budgets/{category}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ReadCostsRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /costs'
      Target: !Sub 'integrations/${CostsIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ListAdminUsersRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'GET /admin/users'
      Target: !Sub 'integrations/${AdminUsersIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  CreateAdminUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /admin/users'
      Target: !Sub 'integrations/${AdminUsersIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  ManageAdminUserRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /admin/users/{username}'
      Target: !Sub 'integrations/${AdminUsersIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  CreateRecurringRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'POST /recurring'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  UpdateRecurringRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'PUT /recurring/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  DeleteRecurringRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties:
      ApiId: !Ref HttpApi
      RouteKey: 'DELETE /recurring/{id}'
      Target: !Sub 'integrations/${ApiIntegration}'
      AuthorizationType: JWT
      AuthorizerId: !Ref JwtAuthorizer

  # Un singolo timer per tutte le regole dell'utente. Nessuna risorsa per ricorrenza.
  RecurringSchedulerRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: Allow
            Principal:
              Service: scheduler.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: invoke-moneta-recurring
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action: lambda:InvokeFunction
                Resource: !GetAtt ApiLambda.Arn

  DailyRecurringSchedule:
    Type: AWS::Scheduler::Schedule
    Properties:
      Description: 'Moneta: genera movimenti ricorrenti ogni mattina (Europe/Rome)'
      FlexibleTimeWindow:
        Mode: 'OFF'
      ScheduleExpression: 'cron(10 6 * * ? *)'
      ScheduleExpressionTimezone: 'Europe/Rome'
      State: ENABLED
      Target:
        Arn: !GetAtt ApiLambda.Arn
        RoleArn: !GetAtt RecurringSchedulerRole.Arn
        Input: '{"source":"aws.scheduler","operation":"recurring-tick"}'
        RetryPolicy:
          MaximumRetryAttempts: 2
          MaximumEventAgeInSeconds: 3600

  ApiStage:
    Type: AWS::ApiGatewayV2::Stage
    Properties:
      ApiId: !Ref HttpApi
      StageName: '$default'
      AutoDeploy: true
      DefaultRouteSettings:
        ThrottlingBurstLimit: 5
        ThrottlingRateLimit: 2

  ApiLambdaPermission:
    Type: AWS::Lambda::Permission
    Properties:
      Action: lambda:InvokeFunction
      FunctionName: !Ref ApiLambda
      Principal: apigateway.amazonaws.com
      SourceArn: !Sub 'arn:${AWS::Partition}:execute-api:${AWS::Region}:${AWS::AccountId}:${HttpApi}/*/*'


  FundGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /fund', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  FundOperationsPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /fund/operations', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  InsightsGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /insights', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  CapitalPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /capital/items', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  CapitalDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'DELETE /capital/items/{id}', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  FundOperationsReverseRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /fund/operations/{id}/reverse', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  InsightsSimulationRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /insights/simulate', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  CapitalPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'PUT /capital/items/{id}', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  FavoritesGetRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'GET /favorites', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  FavoritesPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /favorites', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  FavoritesDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'DELETE /favorites/{id}', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  PlannedPostRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /planned', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  PlannedPutRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'PUT /planned/{id}', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  PlannedDeleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'DELETE /planned/{id}', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}
  PlannedCompleteRoute:
    Type: AWS::ApiGatewayV2::Route
    Properties: {ApiId: !Ref HttpApi, RouteKey: 'POST /planned/{id}/complete', Target: !Sub 'integrations/${ApiIntegration}', AuthorizationType: JWT, AuthorizerId: !Ref JwtAuthorizer}

Outputs:
  ApiUrl:
    Description: 'Base URL per le chiamate API autenticate'
    Value: !Sub 'https://${HttpApi}.execute-api.${AWS::Region}.${AWS::URLSuffix}'
  UserPoolId:
    Value: !Ref UserPool
  UserPoolClientId:
    Value: !Ref UserPoolClient
  CognitoHostedUiBaseUrl:
    Value: !Sub 'https://${CognitoDomainPrefix}.auth.${AWS::Region}.amazoncognito.com'
  TableName:
    Value: !Ref DataTable
  AdminsGroup:
    Value: !Ref AdminsGroup
