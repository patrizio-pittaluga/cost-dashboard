AWSTemplateFormatVersion: '2010-09-09'
Description: 'Moneta - avvisi AWS Budgets sul COSTO COMPLESSIVO mensile dell account, non uno spegnimento automatico.'

Parameters:
  NotificationEmail:
    Type: String
    Description: 'Email che ricevera gli avvisi di superamento budget.'
    AllowedPattern: '^[^@\s]+@[^@\s]+\.[^@\s]+$'
  MonthlyLimitUSD:
    Type: Number
    Description: 'Soglia mensile in USD (3 USD prudenziali rispetto a 4 EUR).'
    Default: 3
    MinValue: 1
    MaxValue: 100

Resources:
  AccountMonthlyBudget:
    Type: AWS::Budgets::Budget
    Properties:
      Budget:
        BudgetName: !Sub '${AWS::StackName}-monthly-account-cost'
        BudgetType: COST
        TimeUnit: MONTHLY
        BudgetLimit:
          Amount: !Ref MonthlyLimitUSD
          Unit: USD
        CostTypes:
          IncludeTax: true
          IncludeSubscription: true
          IncludeRefund: true
          IncludeCredit: true
          IncludeDiscount: true
          IncludeSupport: true
          IncludeUpfront: true
          IncludeRecurring: true
          IncludeOtherSubscription: true
          UseBlended: false
          UseAmortized: false
      NotificationsWithSubscribers:
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 50
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 75
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: ACTUAL
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail
        - Notification:
            NotificationType: FORECASTED
            ComparisonOperator: GREATER_THAN
            ThresholdType: PERCENTAGE
            Threshold: 100
          Subscribers:
            - SubscriptionType: EMAIL
              Address: !Ref NotificationEmail

Outputs:
  BudgetName:
    Value: !Ref AccountMonthlyBudget
  TrackedScope:
    Value: 'Tutto l account AWS (anche risorse esterne alla dashboard)'
